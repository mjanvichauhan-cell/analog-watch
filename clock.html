<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock-Analog</title>
    <link rel="stylesheet" href="clock.css">
</head>
<body>
<div class="container">
    <h1>Analog-Watch</h1>
    <div id="clockContainer">
        <div id="hour"></div>
        <div id="minute"></div>
        <div id="second"></div>
    </div>
    <div id="dateTime">
       <div id="time"></div>
       <div id="date"></div>
    </div>
</div>
    <script src="clock.js"> </script>
</body>
</html>
